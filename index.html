<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>After School</title>
    <link rel="icon" type="image/png" href="images/favicon-32x32.png">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <script type="module">
        const {createApp} = Vue
        const myApp = createApp({
            data(){
                return {
                    subjects:[
                        {
                            id: 1,
                            name: "Mathematics",
                            location: "Ealing",
                            price: "£120",
                            availableInventory: 10,
                            img_data: {
                                image: 'images/math.jpg',
                                alt: "Teacher at whiteboard"
                            }
                        },
                        {
                            id: 2,
                            name: "Science",
                            location: "Wembley",
                            price: "£80",
                            availableInventory: 10,
                            img_data: {
                                image: 'images/science.jpg',
                                alt: "Man using electronic microscope"
                            }
                        },
                        {
                            id: 3,
                            name: "History",
                            location: "Wembley",
                            price: "£150",
                            availableInventory: 10,
                            img_data: {
                                image: 'images/history.jpg',
                                alt: "Library"
                            }
                        },
                        {
                            id: 4,
                            name: "Geography",
                            location: "Acton",
                            price: "£90",
                            availableInventory: 10,
                            img_data: {
                                image: 'images/geography.jpg',
                                alt: "Close-up of a vintage globe showing Asia"
                            }
                        },
                        {
                            id: 5,
                            name: "Art",
                            location: "Ealing",
                            price: "£70",
                            availableInventory: 10,
                            img_data: {
                                image: 'images/art.jpg',
                                alt: "Hand painting with a brush over a watercolour palette"
                            }
                        },
                        {
                            id: 6,
                            name: "Music",
                            location: "Harrow",
                            price: "£100",
                            availableInventory: 10,
                            img_data: {
                                image: 'images/music.jpg',
                                alt: "Person wearing headphones playing an acoustic guitar beside a keyboard and laptop"
                            }
                        },
                        {
                            id: 7,
                            name: "English",
                            location: "Wembley",
                            price: "£85",
                            availableInventory: 10,
                            img_data: {
                                image: 'images/english.jpg',
                                alt: "Open book with pages fanned out against a dark background"
                            }
                        },
                        {
                            id: 8,
                            name: "Computing",
                            location: "Ealing",
                            price: "£110",
                            availableInventory: 10,
                            img_data: {
                                image: 'images/computing.jpg',
                                alt: "Lines of colourful code on a computer screen"
                            }
                        },
                        {
                            id: 9,
                            name: "PE",
                            location: "Acton",
                            price: "£60",
                            availableInventory: 10,
                            img_data: {
                                image: 'images/pe.jpg',
                                alt: "Indoor sports hall with a basketball hoop and goal net"
                            }
                        },
                        {
                            id: 10,
                            name: "Drama",
                            location: "Harrow",
                            price: "£95",
                            availableInventory: 10,
                            img_data: {
                                image: 'images/drama.jpg',
                                alt: "Actors standing on a lit stage"
                            }
                        }
            ],
                    cart: [],
                    showProduct: true
                }
            },
            methods: {
                toggleCheckout(){
                    this.showProduct = !this.showProduct
                },
                addItem(subject){
                    this.cart.push(subject.id)
                },
                spotsLeft(subject){
                    let timesInCart = 0
                    for (const id of this.cart) {
                        if (id === subject.id) {
                            timesInCart = timesInCart + 1
                        }
                    }
                    return subject.availableInventory - timesInCart
                },
                canAddToCart(subject){
                    return this.spotsLeft(subject) > 0
                }
            },
            computed: {
                cartItemCount(){
                    return this.cart.length
                },
                cartSubjects(){
                    const subjectsInCart = []
                    for (const id of this.cart) {
                        const match = this.subjects.find(subject => subject.id === id)
                        subjectsInCart.push(match)
                    }
                    return subjectsInCart
                }
            }
        })
        myApp.mount('#mydiv');
    </script>
    <div id="mydiv">
        <div v-if="showProduct">
            <h1>Classes</h1>
            <p>Available classes, taught by people who <mark>love the subject</mark>.</p>
            <button v-on:click="toggleCheckout">Checkout ({{cartItemCount}})</button>

            <ul>
                <li v-for="subject in subjects">
                    <img v-bind:src="subject.img_data.image" v-bind:alt="subject.img_data.alt">
                    <div>
                        <h2>{{subject.name}}</h2>
                        <p>{{subject.location}} · {{subject.price}}</p>
                        <p>{{spotsLeft(subject)}} spots left</p>
                        <button v-on:click="addItem(subject)" v-bind:disabled="!canAddToCart(subject)">Add to cart</button>
                    </div>
                </li>
            </ul>
        </div>

        <div v-else>
            <h1>Checkout</h1>
            <div class="cart">
                <p v-if="!cartItemCount">No classes added yet.</p>
                <p v-for="subject in cartSubjects">{{subject.name}} · {{subject.price}}</p>
            </div>
            <button v-on:click="toggleCheckout">Back to classes</button>
        </div>
    </div>

    <style>
        body {
            max-width: 1000px;
            margin: 0 auto;
            padding: 48px 24px;
            background: #fbf8f1;
            color: #1d1d1b;
            font: 18px/1.5 system-ui, sans-serif;
        }

        h1 {
            margin: 0;
            font-size: 64px;
            font-weight: 900;
        }

        mark {
            background: #ffe86a;
        }

        ul {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 32px;
            padding: 0;
            list-style: none;
        }

        li {
            border: 2px solid #1d1d1b;
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
            box-shadow: 6px 6px 0 #1d1d1b;
        }

        li img {
            display: block;
            width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
        }

        li div {
            padding: 16px 24px;
        }

        h2, li p {
            margin: 0;
        }
        .cart {
            margin-bottom: 32px;
        }

        .cart p {
            margin: 4px 0 0;
        }

        button {
            margin-top: 16px;
            padding: 8px 16px;
            border: 2px solid #1d1d1b;
            border-radius: 8px;
            background: #ffe86a;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        button:disabled {
            background: #eee;
            color: #999;
            cursor: not-allowed;
        }
    </style>
</body>

</html>
